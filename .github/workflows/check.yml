name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
      - name: Manifest, display resources, storefront assets
        run: node scripts/check.mjs
      - name: Publishable file list
        run: npm pack --dry-run
